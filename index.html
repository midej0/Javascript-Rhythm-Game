<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Game!!!</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/main-menu.js" defer="true"></script>
    <script src="scripts/settings.js" defer="true"></script>
</head>

<body>
    <header id="header">
        <h1 id="mainTitle">Rhythm Game!!!</h1>
        <button id="settingsButton">
            <p>Settings</p>
        </button>
    </header>
    <main id="main">
        <div id="container">

        </div>
        <section class="Popup" id="settingsPopup">
            <h2>Settings</h2>
            <ul>
                <li>
                    <label for="volume">Volume</label>
                    <input type="range" name="Volume" id="volume" min="0" max="1" step="0.01">
                    <p class="ValueText" id="volumeText">100%</p>
                </li>
                <li>
                    <label for="backgroundDim">Background Dim</label>
                    <input type="range" name="BackgroundDim" id="backgroundDim" min="0" max="1" step="0.01">
                    <p class="ValueText" id="backgroundDimText">100%</p>
                </li>
                <li>
                    <label for="scrollSpeed">Scroll Speed</label>
                    <input type="range" name="ScrollSpeed" id="scrollSpeed" min="1" max="20" step="0.1">
                    <p class="ValueText" id="scrollSpeedText">10.0</p>
                </li>
                <li>
                    <label for="highlightReceptor">Highlight Receptor</label>
                    <input type="checkbox" name="HighlightReceptor" id="highlightReceptor">
                </li>
                <li>
                    <label for="drawEndNote">Draw End-Note</label>
                    <input type="checkbox" name="DrawEndNote" id="drawEndNote">
                </li>
                <li>
                    <label for="graphicsQuality">Graphics Quality</label>
                    <select name="GraphicsQuality" id="graphicsQuality">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </li>
            </ul>
        </section>
    </main>
    <footer id="footer">
        <p id="copyrightText">Copyright: hdfsljahfld</p>
    </footer>
</body>

</html>
