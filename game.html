<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts/game.js" defer="true"></script>
    <title>Playing Ts</title>
    <link rel="stylesheet" href="styles/game-style.css">
</head>

<body>
    <main id="main">
        <canvas id="gl-canvas" width="900" height="1600"></canvas>
        <section class="Popup" id="FinishScreen">
            <h2 id="FinishScreenTitle">Chart Finished!</h2>
            <div class="TextBox" id="ScoreTextBox">
                <p id="ScoreText">Score: 177013</p>
            </div>
            <div class="TextBox" id="ComboTextBox">
                <p id="MaxComboText">Max Combo: 39</p>
            </div>
            <div class="TextBox" id="AccuracyContainer">
                <ul id="AccuracyList">
                    <li>Perfect: 39.39%</li>
                    <li>Great: 39.39%</li>
                    <li>Okay: 39.39%</li>
                    <li>Miss: 39.39%</li>
                </ul>
            </div>
            <button class="MenuButton" id="MainMenuButton">
                <p>Main Menu</p>
            </button>
            <button class="MenuButton" id="RetryButton">
                <p>Retry</p>
            </button>
        </section>
    </main>
</body>

</html>
